# ── DataSource (Neon serverless PostgreSQL) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://ep-lucky-wave-al1bj8vp-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_vLZ5ItYuk0Un
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon uses PgBouncer in transaction mode — keep pool small to avoid exhausting
# the serverless connection limit on free/starter plans.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate: Hibernate checks schema against entities but does NOT modify it.
# Flyway owns all DDL changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── External API keys (optional) ──────────────────────────────────────────────
# Semantic Scholar: set API key for higher rate limits (100→1000 req/s)
# https://www.semanticscholar.org/product/api#api-key
semanticscholar.api-key=

# OpenAlex polite pool: provide your email for faster responses
openalex.email=

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
