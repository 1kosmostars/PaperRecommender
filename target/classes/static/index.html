<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Recommender</title>
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #10b981;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Header ── */
header {
  background: var(--primary);
  color: white;
  padding: 0.9rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
header h1 { font-size: 1.2rem; white-space: nowrap; }
.search-wrap { flex: 1; display: flex; gap: 0.5rem; }
#searchInput {
  flex: 1;
  padding: 0.55rem 1rem;
  border-radius: 8px;
  border: none;
  font-size: 0.95rem;
  outline: none;
}
#searchBtn {
  padding: 0.55rem 1.2rem;
  background: var(--primary-dark);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
}
#searchBtn:hover { background: #1e3a8a; }

/* ── User bar ── */
#userBar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0.6rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.88rem;
}
#userBar input {
  padding: 0.35rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.88rem;
  width: 180px;
}
#userBar button {
  padding: 0.35rem 0.9rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.88rem;
}
#userBar button:hover { background: var(--primary-dark); }
#userStatus { color: var(--muted); }

/* ── Activity panel ── */
#activityPanel {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0.9rem 2rem;
  display: none;
}
#activityPanel.visible { display: block; }
.activity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
.activity-header h3 { font-size: 0.88rem; font-weight: 600; color: var(--text); }
.activity-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.activity-pill {
  padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
}
.pill-view     { background: #f1f5f9; color: var(--muted); }
.pill-click    { background: #dbeafe; color: #1d4ed8; }
.pill-save     { background: #d1fae5; color: #065f46; }
.pill-cite     { background: #ede9fe; color: #5b21b6; }
.activity-list { font-size: 0.82rem; color: var(--muted); }
.activity-item { padding: 0.2rem 0; border-bottom: 1px solid var(--border); display: flex; gap: 0.75rem; align-items: center; }
.activity-item:last-child { border-bottom: none; }
.activity-action { font-weight: 600; min-width: 60px; font-size: 0.75rem; }
.activity-title  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.activity-time   { white-space: nowrap; font-size: 0.72rem; }
#activityToggle  { font-size: 0.8rem; color: var(--primary); cursor: pointer; text-decoration: underline; padding: 0.1rem 0; background: none; border: none; }
#userStatus strong { color: var(--text); }

/* ── Main ── */
.container { max-width: 1280px; margin: 1.5rem auto; padding: 0 1.5rem; }

#statusMsg {
  text-align: center;
  color: var(--muted);
  padding: 3rem;
  font-size: 1rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1.2rem;
}

/* ── Card ── */
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 1.3rem;
  border: 1px solid var(--border);
  transition: box-shadow 0.2s, border-color 0.2s;
  display: flex;
  flex-direction: column;
}
.card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); border-color: #c7d7f0; }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
.card-title { font-size: 0.97rem; font-weight: 600; line-height: 1.4; flex: 1; }
.card-year { background: var(--bg); color: var(--muted); padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; white-space: nowrap; }

.card-authors { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.7rem; font-style: italic; }

.card-abstract {
  font-size: 0.83rem;
  color: #475569;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
  margin-bottom: 1rem;
}

.card-footer { display: flex; gap: 0.5rem; align-items: center; }
.badge { font-size: 0.72rem; color: var(--muted); }

.btn-action {
  padding: 0.28rem 0.7rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 0.78rem;
  background: white;
  color: var(--text);
  transition: all 0.15s;
}
.btn-action:hover { background: var(--primary); color: white; border-color: var(--primary); }
.btn-action.active { background: var(--green); color: white; border-color: var(--green); }
.btn-action.cited { background: #7c3aed; color: white; border-color: #7c3aed; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: #1e293b;
  color: white;
  padding: 0.7rem 1.2rem;
  border-radius: 8px;
  font-size: 0.88rem;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
}
#toast.show { opacity: 1; }

.embed-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-right: 4px;
}
.embed-yes { background: var(--green); }
.embed-no  { background: #cbd5e1; }

/* ── Why panel ── */
.btn-why {
  padding: 0.28rem 0.7rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 0.78rem;
  background: white;
  color: var(--muted);
  transition: all 0.15s;
}
.btn-why:hover { background: #f8fafc; border-color: #94a3b8; color: var(--text); }
.why-panel {
  display: none;
  margin-top: 0.7rem;
  padding: 0.65rem 0.85rem;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.79rem;
}
.why-panel.open { display: block; }
.why-title { font-weight: 600; color: var(--text); margin-bottom: 0.45rem; font-size: 0.8rem; }
.why-signals { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.4rem; }
.why-signal {
  padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.73rem; font-weight: 600;
}
.sig-hnsw      { background: #dbeafe; color: #1d4ed8; }
.sig-bpr       { background: #d1fae5; color: #065f46; }
.sig-bm25      { background: #fef3c7; color: #92400e; }
.sig-pagerank  { background: #ede9fe; color: #5b21b6; }
.why-hint { color: var(--muted); font-size: 0.75rem; line-height: 1.4; }
</style>
</head>
<body>

<header>
  <h1>📄 Paper Recommender</h1>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search: attention mechanism, GNN, BERT…" />
    <button id="searchBtn">Search</button>
  </div>
</header>

<div id="userBar">
  <span>User:</span>
  <input id="nameInput" type="text" placeholder="Your name" />
  <button id="loginBtn">Sign in / Register</button>
  <span id="userStatus">Not signed in — showing global recommendations</span>
  <button id="activityToggle" onclick="toggleActivity()" style="display:none">📊 My Activity</button>
  <a href="/admin.html" style="font-size:0.8rem; color:var(--muted); text-decoration:none; margin-left:auto">Admin →</a>
</div>

<div id="activityPanel">
  <div class="activity-header">
    <h3>My Activity</h3>
    <button onclick="toggleActivity()" style="background:none;border:none;cursor:pointer;font-size:1rem;color:var(--muted)">✕</button>
  </div>
  <div class="activity-pills" id="activityPills"></div>
  <div class="activity-list" id="activityList"><em>Loading…</em></div>
</div>

<div class="container">
  <div id="statusMsg">Loading recommendations…</div>
  <div class="grid" id="grid"></div>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let userId   = localStorage.getItem('userId');
let userName = localStorage.getItem('userName');
let savedIds = new Set();
let citedIds = new Set();

function savedKey() { return userId ? `savedIds_${userId}` : 'savedIds_anon'; }
function citedKey() { return userId ? `citedIds_${userId}` : 'citedIds_anon'; }
function loadLocalState() {
  savedIds = new Set(JSON.parse(localStorage.getItem(savedKey()) || '[]'));
  citedIds = new Set(JSON.parse(localStorage.getItem(citedKey()) || '[]'));
}
loadLocalState();

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (userId) {
    showUserStatus(userName, userId);
  }
  loadRecommendations();

  document.getElementById('searchBtn').addEventListener('click', onSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') onSearch();
  });
  document.getElementById('loginBtn').addEventListener('click', onLogin);
});

// ── Auth ──────────────────────────────────────────────────────────────────────
async function onLogin() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return toast('Enter your name first');
  try {
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    userId   = data.id;
    userName = data.name;
    localStorage.setItem('userId',   userId);
    localStorage.setItem('userName', userName);
    loadLocalState();
    showUserStatus(userName, userId);
    toast(`Welcome, ${name}!`);
    loadRecommendations();
  } catch (e) {
    toast('Login failed: ' + e.message);
  }
}

function showUserStatus(name, id) {
  document.getElementById('userStatus').innerHTML =
    `Signed in as <strong>${name}</strong> <span style="color:#94a3b8;font-size:0.75rem">${id.slice(0,8)}…</span>`;
  document.getElementById('nameInput').value = name;
  document.getElementById('activityToggle').style.display = 'inline';
}

// ── Search & Load ─────────────────────────────────────────────────────────────
function onSearch() {
  const q = document.getElementById('searchInput').value.trim();
  loadRecommendations(q);
}

async function loadRecommendations(query) {
  setStatus('Loading…');
  clearGrid();

  let url = `/api/recommend/explain?k=15`;
  if (userId) url += `&userId=${userId}`;
  if (query)  url += `&q=${encodeURIComponent(query)}`;

  try {
    const res   = await fetch(url);
    const items = await res.json();
    if (!Array.isArray(items) || items.length === 0) {
      setStatus('No papers found. Try a different query or ingest some papers first.');
      return;
    }
    setStatus('');
    renderPapers(items);
  } catch (e) {
    setStatus('Error loading recommendations: ' + e.message);
  }
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderPapers(items) {
  const grid = document.getElementById('grid');
  items.forEach(item => grid.appendChild(makeCard(item.paper, item.signals || [], item.rrfScore || 0)));
}

const SIGNAL_LABELS = {
  HNSW:      { cls: 'sig-hnsw',     text: 'Content match' },
  BPR:       { cls: 'sig-bpr',      text: 'Collaborative' },
  BM25:      { cls: 'sig-bm25',     text: 'Text search'   },
  PageRank:  { cls: 'sig-pagerank', text: 'Highly cited'  },
};

function makeCard(p, signals, rrfScore) {
  const isSaved = savedIds.has(p.id);
  const isCited = citedIds.has(p.id);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = p.id;

  const authors = (p.authorNames || []).slice(0, 3).join(', ') +
    ((p.authorNames || []).length > 3 ? ' et al.' : '');

  const signalPills = signals.map(s => {
    const cfg = SIGNAL_LABELS[s] || { cls: '', text: s };
    return `<span class="why-signal ${cfg.cls}">${cfg.text}</span>`;
  }).join('');

  const whyHints = {
    HNSW:     'Similar to papers you have read',
    BPR:      'Liked by users with similar taste',
    BM25:     'Matches your search query',
    PageRank: 'Highly cited in the field',
  };
  const hintLines = signals.map(s => whyHints[s]).filter(Boolean)
    .map(h => `<div>• ${h}</div>`).join('');

  card.innerHTML = `
    <div class="card-header">
      <div class="card-title">${esc(p.title)}</div>
      ${p.year ? `<span class="card-year">${p.year}</span>` : ''}
    </div>
    ${authors ? `<div class="card-authors">${esc(authors)}</div>` : ''}
    <div class="card-abstract">${esc(p.abstractText || 'No abstract available.')}</div>
    <div class="card-footer">
      <span class="badge">
        <span class="embed-dot ${p.hasEmbedding ? 'embed-yes' : 'embed-no'}"></span>
        ${p.citationCount > 0 ? `${p.citationCount} citations` : ''}
      </span>
      <div style="margin-left:auto; display:flex; gap:0.4rem">
        ${signals.length > 0 ? `<button class="btn-why" onclick="toggleWhy(this)">Why?</button>` : ''}
        <button class="btn-action ${isSaved ? 'active' : ''}" data-action="SAVE"
                onclick="interact('${p.id}','SAVE',this)">
          ${isSaved ? '✓ Saved' : '⭐ Save'}
        </button>
        <button class="btn-action ${isCited ? 'cited' : ''}" data-action="CITE"
                onclick="interact('${p.id}','CITE',this)">
          ${isCited ? '✓ In my refs' : '📎 Add to refs'}
        </button>
        ${p.arxivId ? `<a class="btn-action" href="https://arxiv.org/abs/${p.arxivId}" target="_blank">arXiv ↗</a>` : ''}
      </div>
    </div>
    ${signals.length > 0 ? `
    <div class="why-panel">
      <div class="why-title">Why this paper?</div>
      <div class="why-signals">${signalPills}</div>
      <div class="why-hint">${hintLines}</div>
    </div>` : ''}
  `;

  // auto-record CLICK when the card body is clicked (not action buttons)
  card.addEventListener('click', e => {
    if (!e.target.closest('button, a')) interact(p.id, 'CLICK', null, true);
  });

  // auto-record VIEW on card hover (debounced to 2 sec)
  let viewTimer;
  card.addEventListener('mouseenter', () => {
    viewTimer = setTimeout(() => interact(p.id, 'VIEW', null, true), 2000);
  });
  card.addEventListener('mouseleave', () => clearTimeout(viewTimer));

  return card;
}

// ── Why panel ─────────────────────────────────────────────────────────────────
function toggleWhy(btn) {
  const panel = btn.closest('.card').querySelector('.why-panel');
  if (!panel) return;
  const open = panel.classList.toggle('open');
  btn.textContent = open ? 'Hide' : 'Why?';
}

// ── Interactions ──────────────────────────────────────────────────────────────
async function interact(paperId, actionType, btn, silent = false) {
  if (!userId) {
    if (!silent) toast('Sign in to record interactions');
    return;
  }
  try {
    await fetch('/api/interactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, paperId, actionType })
    });

    if (btn) {
      if (actionType === 'SAVE') {
        savedIds.add(paperId);
        localStorage.setItem(savedKey(), JSON.stringify([...savedIds]));
        btn.textContent = '✓ Saved';
        btn.classList.add('active');
      } else if (actionType === 'CITE') {
        citedIds.add(paperId);
        localStorage.setItem(citedKey(), JSON.stringify([...citedIds]));
        btn.textContent = '✓ In my refs';
        btn.classList.add('cited');
      }
    }
    const toastMsg = { SAVE: 'Saved', CITE: 'Added to your references', CLICK: 'Noted', VIEW: 'Viewed' };
    if (!silent) toast(toastMsg[actionType] ?? actionType);
  } catch (e) {
    if (!silent) toast('Failed to record interaction');
  }
}

// ── Activity Panel ────────────────────────────────────────────────────────────
let activityVisible = false;

function toggleActivity() {
  activityVisible = !activityVisible;
  document.getElementById('activityPanel').classList.toggle('visible', activityVisible);
  if (activityVisible) loadActivity();
}

async function loadActivity() {
  if (!userId) return;
  try {
    const data = await fetch(`/api/interactions/user/${userId}`).then(r => r.json());
    if (!Array.isArray(data)) return;

    const counts = { VIEW: 0, CLICK: 0, SAVE: 0, CITE: 0, DOWNLOAD: 0 };
    data.forEach(i => { if (counts[i.actionType] !== undefined) counts[i.actionType]++; });

    const pillConfig = [
      { label: `👁 ${counts.VIEW} views`,   cls: 'pill-view'  },
      { label: `🖱 ${counts.CLICK} clicks`, cls: 'pill-click' },
      { label: `⭐ ${counts.SAVE} saved`,   cls: 'pill-save'  },
      { label: `📎 ${counts.CITE} in refs`, cls: 'pill-cite'  },
    ];
    document.getElementById('activityPills').innerHTML =
      pillConfig.map(p => `<span class="activity-pill ${p.cls}">${p.label}</span>`).join('');

    const sorted = [...data].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);
    const actionColor = { VIEW: 'color:#64748b', CLICK: 'color:#1d4ed8', SAVE: 'color:#065f46', CITE: 'color:#5b21b6', DOWNLOAD: 'color:#92400e' };

    document.getElementById('activityList').innerHTML = sorted.map(i => `
      <div class="activity-item">
        <span class="activity-action" style="${actionColor[i.actionType]||''}">${i.actionType}</span>
        <span class="activity-title">${esc(i.paperTitle || i.paperId.slice(0, 8) + '…')}</span>
        <span class="activity-time">${fmtTimeAgo(i.createdAt)}</span>
      </div>`).join('') || '<em>No interactions yet</em>';
  } catch (e) {
    document.getElementById('activityList').innerHTML = '<em>Failed to load</em>';
  }
}

function fmtTimeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)   return 'just now';
  if (m < 60)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}
function clearGrid() {
  document.getElementById('grid').innerHTML = '';
}
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
</body>
</html>
